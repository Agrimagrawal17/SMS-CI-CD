name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    name: Build Backend and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}

  build-frontend:
    name: Build Frontend and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}

  deploy:
    name: Deploy on Production
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ubuntu
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            docker pull ${{secrets.DOCKERHUB_USERNAME}}/sms-backend:v${{github.run_number}}
            docker pull ${{secrets.DOCKERHUB_USERNAME}}/sms-frontend:v${{github.run_number}}

            docker stop sms-backend || true
            docker rm sms-backend || true
            docker run -d --name sms-backend -p 8000:8000 ${{secrets.DOCKERHUB_USERNAME}}/sms-backend:v${{github.run_number}}

            docker stop sms-frontend || true
            docker rm sms-frontend || true
            docker run -d --name sms-frontend -p 80:5173 ${{secrets.DOCKERHUB_USERNAME}}/sms-backend:v${{github.run_number}}




        

