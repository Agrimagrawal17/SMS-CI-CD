name: Build and Deploy Docker Images

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # STAGE 1: LOGIN
  # ==========================================
  login:
    name: Docker Hub Login
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


  # ==========================================
  # STAGE 2: BUILD & PUSH BACKEND
  # ==========================================
  build-backend:
    name: Build and Push Backend
    needs: login
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}


  # ==========================================
  # STAGE 3: BUILD & PUSH FRONTEND
  # ==========================================
  build-frontend:
    name: Build and Push Frontend
    needs: login
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}


  # ==========================================
  # STAGE 4: DEPLOY BACKEND
  # ==========================================
  deploy-backend:
    name: Deploy Backend
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH CONNECTION SUCCESS"
            whoami
            hostname

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying backend..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}

            docker stop sms-backend || true
            docker rm sms-backend || true

            docker run -d \
              --name sms-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/sms-backend:v${{ github.run_number }}

            echo "Backend deployed successfully"


  # ==========================================
  # STAGE 5: DEPLOY FRONTEND
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "SSH CONNECTION SUCCESS"
            whoami
            hostname

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying frontend..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}

            docker stop sms-frontend || true
            docker rm sms-frontend || true

            docker run -d \
              --name sms-frontend \
              --restart unless-stopped \
              -p 80:5173 \
              ${{ secrets.DOCKERHUB_USERNAME }}/sms-frontend:v${{ github.run_number }}

            echo "Frontend deployed successfully"